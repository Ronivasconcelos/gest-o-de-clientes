<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="description" content="Sistema de gestão de clientes, pagamentos e contatos.">
  <title>Gestão de Clientes</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">👥</div>
        <div>
          <h1>Gestão de Clientes</h1>
          <p>Sistema de cadastro, controle e pagamentos</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-pdf" id="btnBackupPdf" type="button" title="Gerar relatório completo em PDF">▣ Backup PDF</button>
        <button class="btn btn-install" id="btnInstallApp" type="button" title="Instalar aplicativo" hidden>⬇ Instalar aplicativo</button>
        <div class="stats" aria-label="Resumo">
        <div class="stat-card"><span class="label">Total</span><strong id="statTotal">0</strong></div>
        <div class="stat-card paid"><span class="label">Pagos</span><strong id="statPaid">0</strong></div>
        <div class="stat-card unpaid"><span class="label">Pendentes</span><strong id="statUnpaid">0</strong></div>
        <div class="stat-card revenue"><span class="label">Receita mensal</span><strong id="statRevenue">R$ 0,00</strong></div>
        </div>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-header">
          <label class="search-box" for="searchInput">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="Buscar por nome, e-mail, CPF ou empresa" autocomplete="off">
          </label>
          <div class="filters" role="group" aria-label="Filtros">
            <button class="filter-btn active" data-filter="all" type="button">Todos <span class="count" id="countAll">0</span></button>
            <button class="filter-btn" data-filter="paid" type="button">Pagos <span class="count" id="countPaid">0</span></button>
            <button class="filter-btn" data-filter="unpaid" type="button">Pendentes <span class="count" id="countUnpaid">0</span></button>
          </div>
        </div>
        <div class="alpha-index" id="alphaIndex" aria-label="Índice alfabético"></div>
        <div class="client-list" id="clientList" aria-live="polite"></div>
        <div class="sidebar-footer">
          <button class="btn btn-add" id="btnAdd" type="button">＋ Novo cliente</button>
        </div>
      </aside>

      <main class="detail-panel" id="detailPanel">
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">👤</div>
          <h2>Selecione um cliente</h2>
          <p>Escolha um cliente na lista para visualizar dados, pagamentos e ações.</p>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Novo cliente</h2>
        <button class="modal-close" id="modalClose" type="button" aria-label="Fechar">×</button>
      </div>
      <form id="clientForm" novalidate>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group full">
              <label>Foto do cliente</label>
              <div class="photo-upload">
                <div class="photo-preview" id="photoPreview"></div>
                <div class="photo-upload-info">
                  <p>JPG, PNG ou WEBP. A imagem é armazenada somente neste navegador.</p>
                  <label class="btn btn-secondary file-button">Escolher arquivo<input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp"></label>
                  <button class="link-button" type="button" id="removePhoto">Remover foto</button>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label for="fName">Nome completo *</label>
              <input id="fName" name="name" required maxlength="100" autocomplete="name">
            </div>
            <div class="form-group">
              <label for="fCpf">CPF</label>
              <input id="fCpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
            </div>
            <div class="form-group">
              <label for="fEmail">E-mail *</label>
              <input id="fEmail" name="email" type="email" required maxlength="160" autocomplete="email">
            </div>
            <div class="form-group">
              <label for="fPhone">Telefone</label>
              <input id="fPhone" name="phone" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel">
            </div>
            <div class="form-group">
              <label for="fCompany">Empresa</label>
              <input id="fCompany" name="company" maxlength="120">
            </div>
            <div class="form-group">
              <label for="fPosition">Cargo</label>
              <input id="fPosition" name="position" maxlength="100">
            </div>
            <div class="form-group full">
              <label for="fAddress">Endereço</label>
              <input id="fAddress" name="address" maxlength="220" autocomplete="street-address">
            </div>
            <div class="form-group">
              <label for="fDate">Data de cadastro</label>
              <input id="fDate" name="date" type="date">
            </div>
            <div class="form-group">
              <label for="fValue">Valor mensal (R$)</label>
              <input id="fValue" name="value" type="number" step="0.01" min="0" inputmode="decimal">
            </div>
            <div class="form-group">
              <label for="fStatus">Status da conta</label>
              <select id="fStatus" name="status"><option value="paid">Pago</option><option value="unpaid">Pendente</option></select>
            </div>
            <div class="form-group">
              <label for="fCategory">Categoria</label>
              <select id="fCategory" name="category"><option>Premium</option><option>Standard</option><option>Básico</option><option>Empresarial</option></select>
            </div>
            <div class="form-group full">
              <label for="fNotes">Observações</label>
              <textarea id="fNotes" name="notes" maxlength="1000" placeholder="Informações adicionais..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="modalCancel" type="button">Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar cliente</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/app.js" defer></script>
  <noscript>Ative o JavaScript para usar o sistema.</noscript>
</body>
</html>
